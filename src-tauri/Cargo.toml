[package]
name = "tagore-desktop"
version = "1.0.0"
description = "Tagore - A modern writing application for Raspberry Pi"
authors = ["Tagore Team"]
edition = "2021"

[lib]
name = "tagore_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
dirs = "6"
dotenvy = "0.15"
html2text = "0.12"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

